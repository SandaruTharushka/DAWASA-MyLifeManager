# DAWASA download page and update folder.
#
# Paste this block INSIDE the existing `server { listen 443 ssl; ... }` block
# of the website that should host the downloads (or use it in a new server
# block for a dedicated sub-domain). It only serves one static folder and
# does not affect any other location or application on the server.
#
# Files live in /var/www/dawasa/downloads/dawasa/ and are published as
# https://<your-domain>/downloads/dawasa/ (index.html, manifest.json,
# SHA256SUMS and dawasa-<version>-<code>.apk).
#
# After editing: `sudo nginx -t` and, only if it reports success,
# `sudo systemctl reload nginx` (a reload keeps running sites online).

location ^~ /downloads/dawasa/ {
    root /var/www/dawasa;
    index index.html;
    autoindex off;
    charset utf-8;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # The update description must always be fresh.
    location = /downloads/dawasa/manifest.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # APK files never change once published (new versions get new names).
    # nginx serves Range requests for static files, so interrupted
    # downloads resume.
    location ~ \.apk$ {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Nothing else (hidden files, temporary uploads) is served.
    location ~ /\. {
        deny all;
    }
}
