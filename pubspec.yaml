name: dawasa
description: "DAWASA — Daily Life Manager. Your Money. Your Plans. Your Day."
publish_to: 'none'

# versionName+versionCode. The versionCode (after '+') MUST increase for every
# published APK, otherwise Android refuses to install it as an update.
version: 1.0.0+1

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^3.4.3
  # 17.x: 18.x switched to the separate `material_ui` package, which would mix
  # two Material implementations (themes/localizations) with flutter/material.
  go_router: ^17.5.0

  # Local database (SQLite through Drift). SQLite itself is bundled by the
  # `sqlite3` package build hook.
  drift: ^2.35.0
  sqlite3: ^3.6.0
  path_provider: ^2.1.6
  path: ^1.9.1

  # Settings and secrets
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0

  # Localization / formatting
  intl: ^0.20.2

  # Notifications
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Charts
  fl_chart: ^1.2.0

  # Security & crypto
  cryptography: ^2.9.0
  crypto: ^3.0.7
  local_auth: ^3.0.2

  # Files, sharing, images
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  image_picker: ^1.2.3

  # App update module only
  http: ^1.6.0
  package_info_plus: ^10.2.1
  connectivity_plus: ^7.3.1

  uuid: ^4.6.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: NotoSansSinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala-Regular.ttf
        - asset: assets/fonts/NotoSansSinhala-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSinhala-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansSinhala-Bold.ttf
          weight: 700
